<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share</title>
<style id="faces">
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap");
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#e7e9ea;font-family:Inter,Inter,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:active{scale:.96}
.wrap{max-width:600px;margin:0 auto;min-height:100dvh;border-left:1px solid #2f3336;border-right:1px solid #2f3336}
.head{position:sticky;top:0;padding:16px;font-weight:800;font-size:20px;border-bottom:1px solid #2f3336;background:rgba(0,0,0,.86);backdrop-filter:blur(12px)}
.tweet{display:flex;gap:12px;padding:16px}
.meta{display:flex;gap:6px;align-items:center;font-size:15px}
.name{font-weight:700}
.muted{color:#71767b}
.body{margin:4px 0 0;white-space:pre-wrap;font-size:16px;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;max-width:480px;color:#71767b}
.row button,.metric{min-height:44px;display:flex;align-items:center;gap:6px;font-size:13px;color:#71767b;padding:0 2px}
.row svg{display:block}
.sheet-back,.view{position:fixed;inset:0;background:rgba(0,0,0,.72)}
#sheet[hidden],#viewer[hidden]{display:none !important}
#sheet{z-index:20}
.sheet{position:fixed;left:50%;bottom:0;z-index:21;width:min(520px,100%);background:#16181c;border:1px solid #2f3336;border-bottom:0;border-radius:24px 24px 0 0;padding:8px 16px 24px;transform:translate3d(-50%,110%,0)}
.handle{width:40px;height:6px;border-radius:99px;background:#2f3336;margin:8px auto 12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:1px solid #2f3336;background:#000;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.choice b{font-size:15px}
.choice span{color:#71767b;font-size:13px}
.view{z-index:30;display:flex;flex-direction:column}
.view bar,.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.stage-wrap img{max-width:min(920px,100%);border-radius:16px;display:block}
.stage-wrap img.port{max-height:68dvh;width:auto;margin:0 auto}
.actions{display:flex;justify-content:center;gap:12px;padding:8px 16px 20px}
.dl{background:#1d9bf0;color:#fff;font-weight:700;border-radius:999px;padding:12px 20px}
#off{position:fixed;left:-20000px;top:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">Post</div>
  <article class="tweet">
    <div id="avatar"></div>
    <div style="min-width:0;flex:1">
      <div class="meta"><span class="name">Maya Chen</span><svg width="16" height="16" viewBox="0 0 24 24" aria-label="Verified"><path fill="#1d9bf0" d="M12 2l2.1 1.6 2.6-.3 1.1 2.4 2.4 1.1-.3 2.6L22 12l-1.6 2.1.3 2.6-2.4 1.1-1.1 2.4-2.6-.3L12 22l-2.1-1.6-2.6.3-1.1-2.4-2.4-1.1.3-2.6L2 12l1.6-2.1-.3-2.6 2.4-1.1 1.1-2.4 2.6.3L12 2z"/><path fill="#fff" d="M10.2 15.4l-2.7-2.6 1.2-1.2 1.5 1.5 4.1-4.2 1.2 1.2z"/></svg><span class="muted">@mayachen · 2h</span></div>
      <p class="body">took the long way home tonight. the city looked unreal. windows lit, rain just starting, and nobody was in a hurry.</p>
      <div class="row">
        <button type="button" aria-label="Replies"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>128</button>
        <button type="button" aria-label="Reposts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>406</button>
        <button type="button" aria-label="Likes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>2,901</button>
        <span class="metric" aria-label="Views"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>84.2K</span>
        <button type="button" id="share" aria-label="Share"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M10 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></button>
      </div>
    </div>
  </article>
</div>
<div id="sheet" hidden>
  <button class="sheet-back" id="sheetBack" aria-label="Close"></button>
  <div class="sheet" id="panel">
    <div class="handle" id="grip"></div>
    <h2 style="margin:0 0 4px;font-size:18px">Share</h2>
    <p class="muted" style="margin:0 0 14px;font-size:14px">Landscape sits wide. Portrait pulls the post up close.</p>
    <div class="choices">
      <button class="choice" id="pickLand" type="button"><div id="miniL"></div><b>Landscape</b><span>Coins around the card</span></button>
      <button class="choice" id="pickPort" type="button"><div id="miniP"></div><b>Portrait</b><span>Tweet large, coins at the edges</span></button>
    </div>
  </div>
</div>
<div id="viewer" class="view" hidden>
  <div class="bar">
    <button type="button" id="closeView">Close</button>
    <b id="modeLabel">Landscape</b>
    <button type="button" id="swap" style="color:#1d9bf0">Swap</button>
  </div>
  <div class="stage-wrap"><img id="shot" alt="Share card"></div>
  <div class="actions">
    <button class="dl" id="download" type="button">Download</button>
  </div>
</div>
<div id="off"></div>
<script>

let seq = 0;
function stage(mode) {
  const f = FRAMES[mode];

    const d = el("div", "position:absolute;left:" + c.x + "px;top:" + c.y + "px;z-index:1");

function mini(mode, host) {
  const f = FRAMES[mode];

function paintPng(mode) {

  drawAvatar(ctx, pad, pad, av);
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#fff";
  ctx.font = "700 " + u(14.5) + "px " + FONT;
  const nameX = pad + av + u(8);
  const nameY = pad + u(22);
  ctx.fillText(POST.name, nameX, nameY);
  const nameW = ctx.measureText(POST.name).width;
  ctx.fillStyle = "#9AA0AA";
  ctx.font = "500 " + u(12) + "px " + FONT;
  ctx.fillText(POST.handle, nameX + nameW + u(8), nameY);
  ctx.font = "500 " + u(11) + "px " + FONT;
  ctx.textAlign = "right";
  ctx.fillText(POST.date, W - pad, nameY);
  ctx.textAlign = "left";
  lines.forEach((line, i) => {
    const y = bodyTop + fs + i * lh;
    let x = pad;
    ctx.font = "400 " + fs + "px " + FONT;
    if (i === 0) {
      ctx.fillStyle = "#828894";
      const q = "\u201C ";
      ctx.fillText(q, x, y);
      x += ctx.measureText(q).width;
    }
    ctx.fillStyle = "#F2F3F5";
    ctx.fillText(line, x, y);
  });
  const statsY = bodyTop + lines.length * lh + statsGap;
  roundRect(ctx, pad, statsY, W - pad * 2, statsH, u(12));
  ctx.fillStyle = "#1A1C24";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.lineWidth = 1;
  ctx.stroke();
  const metrics = [["reply", POST.replies], ["repost", POST.reposts], ["like", POST.likes], ["views", POST.views]];
  const colW = (W - pad * 2) / 4;
  metrics.forEach((m, i) => {
    const cx = pad + colW * i + colW / 2;
    const icon = u(16);
    if (i) {
      ctx.beginPath();
      ctx.moveTo(pad + colW * i, statsY + u(10));
      ctx.lineTo(pad + colW * i, statsY + statsH - u(10));
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    strokeIcon(ctx, m[0], cx - icon / 2, statsY + u(8), icon, "#9AA0AA");
    ctx.fillStyle = "#fff";
    ctx.font = "700 " + u(12) + "px " + FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(compact(m[1]), cx, statsY + u(44));
    ctx.textAlign = "left";
  });
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.font = "800 " + u(22) + "px " + DISPLAY;
  ctx.fillText("amity", pad, darkH + footH * 0.52);
  ctx.textAlign = "right";
  ctx.font = "500 " + u(10) + "px " + FONT;
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.fillText("10% off fees with code", W - pad, darkH + u(16));
  ctx.font = "800 " + u(12) + "px " + DISPLAY;
  ctx.fillStyle = "#fff";
  ctx.fillText("amity", W - pad, darkH + u(32));
  ctx.restore();
  return cnv.toDataURL("image/png");
}
document.getElementById("avatar").appendChild(avatar(40));
mini("landscape", document.getElementById("miniL"));
mini("portrait", document.getElementById("miniP"));

const sheet = document.getElementById("sheet");
const panel = document.getElementById("panel");
const viewer = document.getElementById("viewer");
const shot = document.getElementById("shot");
let mode = "landscape";
let png = "";
let y = 480, v = 0, target = 0, drag = null, raf = 0;

function tick() {
  if (!sheet.hidden) {
    if (!drag) {
      const dt = 0.016;
      const a = -280 * (y - target) - 22 * v;
      v += a * dt; y += v * dt;
    }
    panel.style.transform = "translate3d(-50%, " + Math.max(y, -16) + "px, 0)";
    if (!drag && target > 0 && y > panel.offsetHeight * 0.92) { sheet.hidden = true; cancelAnimationFrame(raf); return; }
  }
  raf = requestAnimationFrame(tick);
}
function openSheet() {
  sheet.hidden = false; y = panel.offsetHeight || 480; v = 0; target = 0;
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function closeSheet() { target = 900; }
document.getElementById("share").onclick = openSheet;
document.getElementById("sheetBack").onclick = closeSheet;
document.getElementById("grip").onpointerdown = (e) => { drag = e.clientY; e.currentTarget.setPointerCapture(e.pointerId); };
document.getElementById("grip").onpointermove = (e) => { if (drag == null) return; const dy = e.clientY - drag; drag = e.clientY; v = dy / 0.016; y = Math.max(-12, y + dy); };
document.getElementById("grip").onpointerup = () => { drag = null; target = y > 140 || v > 800 ? 900 : 0; };

async function show(next) {
  mode = next;
  sheet.hidden = true;
  viewer.hidden = false;
  document.getElementById("modeLabel").textContent = mode === "landscape" ? "Landscape" : "Portrait";
  shot.className = mode === "portrait" ? "port" : "";
  shot.alt = "Rendering image";
  try {
    if (document.fonts && document.fonts.ready) {
      await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]);
    }
    png = paintPng(mode);
    shot.src = png;
    shot.alt = "amity share card";
  } catch (e) {
    shot.removeAttribute("src");
    shot.alt = "Could not render image";
    png = "";
  }
}
document.getElementById("pickLand").onclick = () => show("landscape");
document.getElementById("pickPort").onclick = () => show("portrait");
document.getElementById("swap").onclick = () => show(mode === "landscape" ? "portrait" : "landscape");
document.getElementById("closeView").onclick = () => { viewer.hidden = true; };
document.getElementById("download").onclick = () => {
  if (!png) return;
  const a = document.createElement("a");
  a.href = png; a.download = "amity-" + mode + ".png"; a.click();
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { viewer.hidden = true; closeSheet(); } });
</script>
